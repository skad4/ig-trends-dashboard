name: Weekly update (every Monday)

on:
  schedule:
    # Every Monday 06:23 UTC = 06:23 Irish time in winter, 07:23 in summer (before the school day)
    - cron: "23 6 * * 1"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab
  push:                   # also refresh when the data pipeline code changes
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect data + AI analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m pipeline.run_weekly

      - name: Commit updated data
        run: |
          git config user.name "trends-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Weekly update $(date -u +%F)"
          git push
